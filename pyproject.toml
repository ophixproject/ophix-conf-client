[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-conf-client"
version = "2026.03.23.01"
description = "Configuration client for Ophix Project Servers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ophix Project" }
]
dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
    "distro>=1.8",
    "urllib3>=2.0",
]

[project.scripts]
conf-client = "ophix_conf_client.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
