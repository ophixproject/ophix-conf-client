[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-conf-client"
version = "2026.06.15.03"
description = "Configuration client for Ophix Project Servers"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [
    { name = "Ophix Project" }
]
keywords = ["ophix", "fleet management", "configuration", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "ophix-client-core>=2026.06.04.01",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "distro>=1.8",
    "urllib3>=1.26",
]

[project.urls]
Homepage = "https://ophix.io"
Documentation = "https://github.com/ophixproject/ophix-conf-client#readme"
Source = "https://github.com/ophixproject/ophix-conf-client"

[project.scripts]
conf-client = "conf_client.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
